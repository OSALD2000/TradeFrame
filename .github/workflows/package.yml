name: Download packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run package
        env:
          TRADEFRAME_MICROSOFT_CLIENT_ID: ${{ vars.TRADEFRAME_MICROSOFT_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: TradeFrame-${{ runner.os }}-${{ runner.arch }}
          path: |
            release/*.tar.gz
            release/*.zip
            release/*.deb
            release/*.sha256
          if-no-files-found: error
