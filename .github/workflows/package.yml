name: Download packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run package
        env:
          TRADEFRAME_MICROSOFT_CLIENT_ID: ${{ vars.TRADEFRAME_MICROSOFT_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: TradeFrame-${{ runner.os }}-${{ runner.arch }}
          path: |
            release/*.tar.gz
            release/*.zip
            release/*.deb
            release/*.sha256
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: TradeFrame-*
          merge-multiple: true
          path: release
      - name: Require all platforms and verify checksums
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$version"
          for artifact in "TradeFrame-$version-linux-x64.tar.gz" "TradeFrame-$version-amd64.deb" "TradeFrame-$version-win32-x64.zip" "TradeFrame-$version-darwin-arm64.zip" "TradeFrame-$version-darwin-x64.zip"; do
            test -s "release/$artifact"
            test -s "release/$artifact.sha256"
          done
          cd release
          sha256sum -c *.sha256
      - name: Prepare draft with all platform downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --draft --verify-tag --title "TradeFrame $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
          fi
